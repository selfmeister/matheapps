name: MathPilotReleaseSmoke
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  MathPilotReleaseSmoke:
    type: application
    platform: iOS
    sources:
      - path: ../../AppBrand.swift
      - path: ../../ContentView.swift
      - path: ../../CurriculumSettings.swift
      - path: ../../GameManager.swift
      - path: ../../GameViews.swift
      - path: ../../Localization.swift
      - path: ../../SoundManager.swift
      - path: TestApp.swift
      - path: ../../Assets.xcassets
      - path: ../../bomb.mp4
      - path: ../../bomb_explosion.wav
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mathpilot.release-smoke
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  ReleaseFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FlowTests.swift]
    dependencies:
      - target: MathPilotReleaseSmoke
  ReleaseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests.swift]
    dependencies:
      - target: MathPilotReleaseSmoke
schemes:
  ReleaseSmoke:
    build:
      targets:
        MathPilotReleaseSmoke: all
    test:
      targets:
        - ReleaseFlowTests
        - ReleaseUITests
